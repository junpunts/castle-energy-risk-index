<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:24px;display:flex;flex-direction:column;gap:16px}
.sw{display:flex;align-items:center;gap:14px}
.chip{width:56px;height:56px;border:1px solid var(--border)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:.02em}
.name{font-family:var(--font-body);font-size:14px;font-weight:500}
</style></head><body><div class="card">
  <div class="sw"><div class="chip" style="background:#171717"></div><div><div class="name">Ink / primary text</div><div class="meta">#171717 · --fg</div></div></div>
  <div class="sw"><div class="chip" style="background:#525252"></div><div><div class="name">Graphite / secondary</div><div class="meta">#525252 · --fg-2</div></div></div>
  <div class="sw"><div class="chip" style="background:#737373"></div><div><div class="name">Smoke / muted</div><div class="meta">#737373 · --fg-3</div></div></div>
  <div class="sw"><div class="chip" style="background:#E5E5E5"></div><div><div class="name">Mist / subtle bg</div><div class="meta">#E5E5E5 · --bg-subtle</div></div></div>
  <div class="sw"><div class="chip" style="background:#F5F5F0"></div><div><div class="name">Bone / marketing bg</div><div class="meta">#F5F5F0 · --bg</div></div></div>
</div></body></html>
