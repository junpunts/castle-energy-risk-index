<!doctype html>
<html><head><meta charset="utf-8"><title>Palette — Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);font-family:var(--font-body);color:var(--fg);padding:20px}
.lead{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .chip{aspect-ratio:1;width:100%;border:1px solid var(--border)}
.sw .name{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:var(--fg-2)}
.sw .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="lead">Earthy accents — use in ~20% of any composition, never &gt;2 in a single context</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#246075"></div><span class="name">Teal</span><span class="hex">#246075</span></div>
  <div class="sw"><div class="chip" style="background:#00544F"></div><span class="name">Teal Deep</span><span class="hex">#00544F</span></div>
  <div class="sw"><div class="chip" style="background:#002E2C"></div><span class="name">Midnight</span><span class="hex">#002E2C</span></div>
  <div class="sw"><div class="chip" style="background:#395938"></div><span class="name">Forest</span><span class="hex">#395938</span></div>
  <div class="sw"><div class="chip" style="background:#2E5A34"></div><span class="name">Moss</span><span class="hex">#2E5A34</span></div>
  <div class="sw"><div class="chip" style="background:#3A5C9A"></div><span class="name">Blue Deep</span><span class="hex">#3A5C9A</span></div>
  <div class="sw"><div class="chip" style="background:#305DA0"></div><span class="name">Blue Royal</span><span class="hex">#305DA0</span></div>
</div>
</body></html>
