<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);color:var(--fg);padding:24px 28px;font-family:var(--font-body)}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.caps{font-family:var(--font-mono);font-weight:600;text-transform:uppercase;color:var(--fg);margin-bottom:10px}
.w1{font-size:13px;letter-spacing:0.4em}
.w2{font-size:12px;letter-spacing:0.25em}
.w3{font-size:11px;letter-spacing:0.2em;color:var(--fg-2)}
.num{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:var(--fg);margin-top:8px}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;letter-spacing:0.05em}
</style></head><body>
<div class="eyebrow">Geist Mono Semi Bold · tags, buttons, forms</div>
<div class="caps w1">CASTLE TECHNOLOGIES</div>
<div class="caps w2">GET IN TOUCH</div>
<div class="caps w3">COMING SOON</div>
<div class="num">64%  $2.4M  +0.32</div>
<div class="meta">Tracking: 0.4em (brand) · 0.25em (buttons) · −0.02em (numerics)</div>
</body></html>
