<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-mono);font-size:12px;letter-spacing:.25em;text-transform:uppercase;font-weight:500;padding:14px 28px;border:none;cursor:pointer;transition:opacity .2s}
.btn-solid{background:#171717;color:#F5F5F0}
.btn-solid:hover{opacity:.8}
.btn-outline{background:transparent;color:rgba(24,24,24,.65);border:1px solid rgba(24,24,24,.12)}
.btn-outline:hover{color:#171717;border-color:rgba(24,24,24,.4)}
.btn-disabled{opacity:.5;pointer-events:none}
</style></head><body><div class="card">
  <button class="btn btn-solid">Get in Touch</button>
  <button class="btn btn-outline">Learn More</button>
  <button class="btn btn-solid btn-disabled">Sending…</button>
</div></body></html>
