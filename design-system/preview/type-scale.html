<!doctype html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);color:var(--fg);padding:20px 24px}
table{width:100%;border-collapse:collapse}
td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:baseline}
.name{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;width:120px}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);white-space:nowrap;font-variant-numeric:tabular-nums;width:110px;text-align:right}
.sample{font-family:var(--font-display);letter-spacing:-0.01em;color:var(--fg)}
.sample.body{font-family:var(--font-body);font-weight:400}
.sample.mono{font-family:var(--font-mono);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
</style></head><body>
<table>
<tr><td class="name">Display XL</td><td class="sample" style="font-size:40px;line-height:1">Castle</td><td class="spec">40 / 1.05</td></tr>
<tr><td class="name">Display</td><td class="sample" style="font-size:28px;line-height:1.1">Hedging the unhedgeable</td><td class="spec">28 / 1.1</td></tr>
<tr><td class="name">H3</td><td class="sample" style="font-size:20px">Situation overview</td><td class="spec">20 / 1.15</td></tr>
<tr><td class="name">Body L</td><td class="sample body" style="font-size:16px">Browse and track contracts</td><td class="spec">16 / 1.55</td></tr>
<tr><td class="name">Body</td><td class="sample body" style="font-size:13px;color:var(--fg-2)">Secondary and helper copy</td><td class="spec">13 / 1.55</td></tr>
<tr><td class="name">Mono</td><td class="sample mono" style="font-size:12px">$2,450 · 64% · TICKER</td><td class="spec">12 / −0.02</td></tr>
</table>
</body></html>
