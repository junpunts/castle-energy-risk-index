<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#080a0f;color:#c8ccd8;font-family:var(--font-body)}
.card{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sw{display:flex;align-items:center;gap:12px}
.chip{width:48px;height:48px;border:1px solid #1c2030}
.name{font-family:var(--font-body);font-size:13px;font-weight:500;color:#c8ccd8}
.meta{font-family:var(--font-mono);font-size:10px;color:#8890a8}
</style></head><body><div class="card">
  <div class="sw"><div class="chip" style="background:#080A0F"></div><div><div class="name">BG</div><div class="meta">#080A0F</div></div></div>
  <div class="sw"><div class="chip" style="background:#0D0F16"></div><div><div class="name">Surface</div><div class="meta">#0D0F16</div></div></div>
  <div class="sw"><div class="chip" style="background:#11141D"></div><div><div class="name">Surface 2</div><div class="meta">#11141D</div></div></div>
  <div class="sw"><div class="chip" style="background:#1C2030"></div><div><div class="name">Border</div><div class="meta">#1C2030</div></div></div>
  <div class="sw"><div class="chip" style="background:#3AB8C0"></div><div><div class="name">Accent (sit)</div><div class="meta">#3AB8C0</div></div></div>
  <div class="sw"><div class="chip" style="background:#C74545"></div><div><div class="name">Negative</div><div class="meta">#C74545</div></div></div>
</div></body></html>
