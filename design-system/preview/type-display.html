<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);color:var(--fg);padding:24px 28px}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.line{font-family:var(--font-display);letter-spacing:-0.01em;font-weight:400;line-height:1.05;margin:0}
.l1{font-size:56px}
.l2{font-size:36px}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;letter-spacing:0.05em}
</style></head><body>
<div class="eyebrow">Hedvig Letters Serif · headings</div>
<p class="line l1">Hedging the unhedgeable</p>
<p class="line l2" style="margin-top:12px">Castle's risk marketplace</p>
<div class="meta">Letter-spacing −0.01em · line-height manual · never auto</div>
</body></html>
