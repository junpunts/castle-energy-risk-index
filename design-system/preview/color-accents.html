<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sw{display:flex;align-items:center;gap:12px}
.chip{width:48px;height:48px;flex:none}
.name{font-family:var(--font-body);font-size:13px;font-weight:500}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body><div class="card">
  <div class="sw"><div class="chip" style="background:#246075"></div><div><div class="name">Teal</div><div class="meta">#246075</div></div></div>
  <div class="sw"><div class="chip" style="background:#00544F"></div><div><div class="name">Teal · Deep</div><div class="meta">#00544F</div></div></div>
  <div class="sw"><div class="chip" style="background:#002E2C"></div><div><div class="name">Teal · Midnight</div><div class="meta">#002E2C</div></div></div>
  <div class="sw"><div class="chip" style="background:#395938"></div><div><div class="name">Forest</div><div class="meta">#395938</div></div></div>
  <div class="sw"><div class="chip" style="background:#2E5A34"></div><div><div class="name">Moss</div><div class="meta">#2E5A34</div></div></div>
  <div class="sw"><div class="chip" style="background:#3A5C9A"></div><div><div class="name">Deep Blue</div><div class="meta">#3A5C9A</div></div></div>
</div></body></html>
