<!doctype html>
<html><head><meta charset="utf-8"><title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg);padding:22px 24px;font-family:var(--font-body);color:var(--fg)}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(24,24,24,0.65);display:block;margin-bottom:8px}
.input{font-family:var(--font-mono);font-size:14px;letter-spacing:0.04em;background:rgba(24,24,24,0.04);border:1px solid rgba(24,24,24,0.15);color:#171717;padding:14px 16px;width:100%;outline:none;box-sizing:border-box;border-radius:0}
.input:focus{border-color:rgba(24,24,24,0.4)}
.input.err{border-color:rgba(153,27,27,0.5)}
.row{display:flex;gap:14px;margin-bottom:12px}
.col{flex:1}
.toggle-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.toggle{position:relative;width:44px;height:24px;border-radius:12px;background:#171717;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:2px;left:22px;width:20px;height:20px;border-radius:10px;background:#F5F5F0}
.toggle-label{font-family:var(--font-mono);font-size:13px;color:#171717}
</style></head><body>
<div class="row">
  <div class="col"><label class="label">NAME</label><input class="input" placeholder="Your name" value="Elena March"></div>
  <div class="col"><label class="label">EMAIL</label><input class="input err" value="invalid@"></div>
</div>
<div class="toggle-row"><div class="toggle"></div><span class="toggle-label">Request whitepaper</span></div>
</body></html>
