<!doctype html>
<html><head><meta charset="utf-8"><title>Palette — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);font-family:var(--font-body);color:var(--fg);padding:20px}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .chip{aspect-ratio:1;width:100%;border:1px solid var(--border)}
.sw .name{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--fg-2)}
.sw .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#171717"></div><span class="name">Black</span><span class="hex">#171717</span></div>
  <div class="sw"><div class="chip" style="background:#525252"></div><span class="name">Graphite</span><span class="hex">#525252</span></div>
  <div class="sw"><div class="chip" style="background:#737373"></div><span class="name">Smoke</span><span class="hex">#737373</span></div>
  <div class="sw"><div class="chip" style="background:#A3A3A3"></div><span class="name">Fog</span><span class="hex">#A3A3A3</span></div>
  <div class="sw"><div class="chip" style="background:#E5E5E5"></div><span class="name">Mist</span><span class="hex">#E5E5E5</span></div>
  <div class="sw"><div class="chip" style="background:#F5F5F5"></div><span class="name">Paper</span><span class="hex">#F5F5F5</span></div>
  <div class="sw"><div class="chip" style="background:#F5F5F0"></div><span class="name">Bone</span><span class="hex">#F5F5F0</span></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><span class="name">White</span><span class="hex">#FFFFFF</span></div>
</div>
</body></html>
