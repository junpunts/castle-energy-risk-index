<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);padding:22px 24px;font-family:var(--font-body);color:var(--fg)}
.lead{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:12px}
.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;color:#171717}
.ic span{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;color:var(--fg-3)}
svg{display:block}
</style></head><body>
<div class="lead">Lucide line icons · 1.6px stroke · round caps · + hand-drawn knight set</div>
<div class="row">
<div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg><span>ARROW</span></div>
<div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg><span>SEARCH</span></div>
<div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg><span>CLOSE</span></div>
<div class="ic"><svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13c0-4 3-7 6-7s6 3 6 7v4c0 1-.5 2-1.5 3l-2.5 1v2h-4v-2l-2.5-1c-1-1-1.5-2-1.5-3v-4z"/><path d="M11 15h10"/><path d="M16 6c0-2 1-3 3-4 2 0 3 1 3 2s-1 2-2 2"/><path d="M13 25v3h6v-3"/></svg><span>KNIGHT</span></div>
<div class="ic"><svg width="22" height="22" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 58h32"/><path d="M18 58c0-2 2-4 4-4h20c2 0 4 2 4 4"/><path d="M26 51V38c0-2 1-4 3-5l5-3"/><path d="M38 51V36c0-3-1-5-3-7"/><path d="M38 29c2-4 3-8 2-12-1-3-3-5-6-6l-4-1c-2 0-3 1-3 3l1 4-4 2c-2 1-3 3-3 5v5l5-3"/><circle cx="28" cy="18" r="2" fill="currentColor"/></svg><span>CHESS</span></div>
</div>
</body></html>
