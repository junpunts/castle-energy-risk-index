<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}

.meta{font-family:var(--font-mono);font-size:11px;color:#737373}

</style></head><body><div class="card">

  <div class="r"><span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/><path d="M12 7v5l3 2"/></svg></span><span class="lbl">Watchlist</span><span class="meta">⌘3</span></div>
  <div class="r"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16"/></svg></span><span class="lbl">Portfolio</span><span class="meta">⌘4</span></div>
</div></body></html>
