<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:20px}
.item{border:1px solid rgba(24,24,24,.12);background:#fff;padding:18px}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#737373;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.title{font-family:var(--font-body);font-size:15px;font-weight:600;line-height:1.35;margin-bottom:6px}
.desc{font-family:var(--font-body);font-size:13px;color:#525252;line-height:1.5}
.foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.prob{font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:-.02em;color:#246075;font-variant-numeric:tabular-nums}
.src{font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:.08em}
</style></head><body><div class="card"><div class="item">
  <div class="eyebrow"><span>TRADE POLICY</span><span>POLYMARKET</span></div>
  <div class="title">Will US–China tariff truce hold through Q3?</div>
  <div class="desc">Resolves YES if no new reciprocal tariffs above 10% are announced by either side before Sep 30, 2026.</div>
  <div class="foot"><span class="prob">64%</span><span class="src">VOL $2.4M</span></div>
</div></div></body></html>
