<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:0}
.hdr{padding:14px 20px;border-bottom:1px solid rgba(24,24,24,.12);display:flex;justify-content:space-between;align-items:center}
.t{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#737373}
.b{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:#246075;background:rgba(36,96,117,.1);padding:2px 6px}
.body{padding:18px 20px}
.k{font-family:var(--font-display);font-size:36px;line-height:1;letter-spacing:-.01em}
.s{font-family:var(--font-body);font-size:13px;color:#525252;margin-top:6px}
.row{padding:0 20px 18px;display:flex;justify-content:space-between;border-top:1px solid rgba(24,24,24,.08);padding-top:10px}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:-.02em}
</style></head><body><div class="card">
  <div class="hdr"><span class="t">PORTFOLIO EXPOSURE</span><span class="b">LIVE</span></div>
  <div class="body"><div class="k">$2,400,000</div><div class="s">Hedged notional across 14 contracts</div></div>
  <div class="row"><span class="m" style="color:#737373">7D</span><span class="m" style="color:#246075">+12.4bps</span></div>
</div></body></html>
