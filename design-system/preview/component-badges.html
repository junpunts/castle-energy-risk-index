<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;padding:4px 10px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:-.02em}
.solid{background:#171717;color:#F5F5F0}
.sec{background:#F5F5F5;color:#171717;border:1px solid rgba(24,24,24,.1)}
.out{border:1px solid rgba(24,24,24,.2);color:#171717}
.succ{background:rgba(57,89,56,.08);color:#395938}
.warn{background:rgba(36,96,117,.08);color:#246075}
.dang{background:rgba(153,27,27,.08);color:#991b1b}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}
</style></head><body><div class="card">
  <span class="b solid">HIGH</span>
  <span class="b sec">POLYMARKET</span>
  <span class="b out">DRAFT</span>
  <span class="b succ"><span class="dot"></span>ACTIVE</span>
  <span class="b warn">Q3 2026</span>
  <span class="b dang">CRITICAL</span>
</div></body></html>
