<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg);padding:22px 24px;font-family:var(--font-body);color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;padding:14px 32px;border:none;border-radius:0;cursor:pointer;transition:opacity .2s,color .2s,border-color .2s}
.btn-w{background:#171717;color:#F5F5F0}
.btn-w:hover{opacity:.8}
.btn-o{background:transparent;color:rgba(24,24,24,0.65);border:1px solid rgba(24,24,24,0.12)}
.btn-o:hover{color:#171717;border-color:rgba(24,24,24,0.4)}
.btn-sm{font-size:11px;padding:10px 20px;letter-spacing:0.2em}
.btn-solid-prod{background:#171717;color:#fff;padding:12px 20px;border:none;font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;gap:8px}
.lead{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
</style></head><body>
<div class="lead">Marketing · ALL-CAPS mono</div>
<div class="row"><button class="btn btn-w">GET IN TOUCH</button><button class="btn btn-o">REQUEST WHITEPAPER</button><button class="btn btn-w btn-sm">SUBMIT</button></div>
<div class="lead" style="margin-top:18px">Product · sentence case</div>
<div class="row"><button class="btn-solid-prod">Discover your company's risk →</button></div>
</body></html>
