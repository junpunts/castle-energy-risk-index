<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg);padding:22px 24px;display:flex;align-items:center;gap:28px;font-family:var(--font-body);color:var(--fg)}
.wordmark{font-family:var(--font-logo);font-weight:300;letter-spacing:-0.06em;font-size:42px;line-height:1}
.mark img{height:42px;width:auto}
.meta{margin-left:auto;display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);letter-spacing:0.05em;text-align:right}
</style></head><body>
<div class="wordmark">Castle</div>
<div class="mark"><img src="../assets/castle-logo-black.svg" alt="Castle logo"/></div>
<div class="meta"><span>WORDMARK · AVERIA SERIF LIBRE LIGHT</span><span>ICON · BITMAP SVG (currentColor)</span><span>TRACKING −6%</span></div>
</body></html>
