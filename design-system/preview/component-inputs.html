<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.card{padding:24px}
.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:rgba(24,24,24,.65);display:block;margin-bottom:8px}
.inp{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;background:rgba(24,24,24,.04);border:1px solid rgba(24,24,24,.15);color:#171717;padding:14px 16px;width:100%;outline:none;box-sizing:border-box;border-radius:0}
.inp:focus{border-color:rgba(24,24,24,.4)}
.row{display:flex;gap:14px}
.row>div{flex:1}
</style></head><body><div class="card">
  <div class="row">
    <div><span class="lbl">NAME</span><input class="inp" placeholder="Your name" value="Harold Finch"></div>
    <div><span class="lbl">EMAIL</span><input class="inp" placeholder="you@company.com"></div>
  </div>
</div></body></html>
