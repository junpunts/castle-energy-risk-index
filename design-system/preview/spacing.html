<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--bg-card);padding:22px 24px;font-family:var(--font-body);color:var(--fg)}
.row{display:flex;align-items:flex-end;gap:14px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:#171717;width:24px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.lead{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-3);margin-bottom:12px}
</style></head><body>
<div class="lead">Spacing · 4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 60px</div>
<div class="row">
  <div class="step"><div class="bar" style="height:4px"></div><span class="lbl">4</span></div>
  <div class="step"><div class="bar" style="height:8px"></div><span class="lbl">8</span></div>
  <div class="step"><div class="bar" style="height:12px"></div><span class="lbl">12</span></div>
  <div class="step"><div class="bar" style="height:16px"></div><span class="lbl">16</span></div>
  <div class="step"><div class="bar" style="height:20px"></div><span class="lbl">20</span></div>
  <div class="step"><div class="bar" style="height:24px"></div><span class="lbl">24</span></div>
  <div class="step"><div class="bar" style="height:32px"></div><span class="lbl">32</span></div>
  <div class="step"><div class="bar" style="height:40px"></div><span class="lbl">40</span></div>
  <div class="step"><div class="bar" style="height:60px"></div><span class="lbl">60</span></div>
</div>
</body></html>
